# Deploy automático no Render: conecte o repositório e ele lê este arquivo.
services:
  - type: web
    name: site-assistente-ia
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Preencha no painel do Render (Environment):
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEBUG
        value: "False"
